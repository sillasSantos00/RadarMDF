<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Radar MDF - Cadastro de Produto</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      min-height: 100vh;
    }
    .sidebar {
      width: 220px;
      background-color: #343a40;
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      padding-top: 20px;
    }
    .sidebar a {
      color: #fff;
      padding: 12px 20px;
      display: block;
      text-decoration: none;
    }
    .sidebar a:hover {
      background-color: #495057;
    }
    .main-content {
      margin-left: 220px;
      padding: 40px;
    }
  </style>
</head>
<body>

<!-- 🧭 Menu lateral -->
<div class="sidebar">
  <h4 class="text-white text-center mb-4">Radar MDF</h4>
  <a href="index.html">🏠 Início</a>
  <a href="cadastro.html">📦 Cadastrar Produto</a>
  <a href="relatorios.html">📊 Relatórios</a>
  <a href="#">⚙️ Configurações</a>
</div>

<!-- 📋 Conteúdo principal -->
<div class="main-content">
  <h2 class="mb-4">📦 Cadastro de Produto</h2>

  <form id="form-produto" class="bg-white p-4 rounded shadow-sm">
    <div class="mb-3">
      <label class="form-label">N patrimonio </label>
      <input type="number" name="preco" class="form-control" step="0.01" required>
    </div>

    <!-- Nome do item -->
    <div class="mb-3">
      <label class="form-label">Nome do item</label>
      <select id="nomeItem" class="form-select">
        <option value="CPU Dell i3">CPU Dell i3</option>
        <option value="CPU Dell i7">CPU Dell i7</option>
        <option value="CPU win 7">CPU win 7</option>
      </select>
    </div>

    <!-- Código do item -->
    <div class="mb-3">
      <label class="form-label">Código do item</label>
      <input type="text" id="codigoItem" class="form-control" readonly>
    </div>

    <!-- Tipo -->
    <div class="mb-3">
      <label class="form-label">Tipo</label>
      <select name="tipo" class="form-select">
        <option value="COMPUTADOR">COMPUTADOR</option>
        <option value="MONITOR">MONITOR</option>
        <option value="SWITCH">SWITCH</option>
      </select>
    </div>
    <!-- Repita com outros names diferentes: loja, setor, estadoConservacao etc. -->

    <div class="mb-3">
      <label class="form-label">loja </label>
      <select name="categoria" class="form-select">
        <option value="COMPUTADOR">COMPUTADOR</option>
        <option value="MONITOR">MONITOR </option>
        <option value="SWITCH">SWITCH</option>
      </select>
    </div>

    <div class="mb-3">
      <label class="form-label">setor </label>
      <select name="categoria" class="form-select">
        <option value="COMPUTADOR">COMPUTADOR</option>
        <option value="MONITOR">MONITOR </option>
        <option value="SWITCH">SWITCH</option>
      </select>
    </div>

    <div class="mb-3">
      <label class="form-label">estado de conservacao </label>
      <select name="categoria" class="form-select">
        <option value="COMPUTADOR">COMPUTADOR</option>
        <option value="MONITOR">MONITOR </option>
        <option value="SWITCH">SWITCH</option>
      </select>
    </div>



    <div class="mb-3">
      <label class="form-label">Descrição</label>
      <textarea name="descricao" class="form-control" rows="3"></textarea>
    </div>


    <button type="submit" class="btn btn-primary w-100">✅ Cadastrar Produto</button>
  </form>
</div>

<script>
  // Espera até que o DOM esteja carregado
  window.addEventListener("DOMContentLoaded", function () {
    const nomeItem = document.getElementById("nomeItem");
    const codigoItem = document.getElementById("codigoItem");

    const codigos = {
      "CPU Dell i3": "45678",
      "CPU Dell i7": "12321",
      "CPU win 7": "78901"
    };

    nomeItem.addEventListener("change", function () {
      codigoItem.value = codigos[nomeItem.value] || "";
    });
  });
</script>

</body>
</html>
