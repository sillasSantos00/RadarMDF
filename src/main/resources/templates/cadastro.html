  <script src="cadastro.js"></script>

  <style>
    body {
      min-height: 100vh;
    }
    .sidebar {
      width: 220px;
      background-color: #343a40;
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      padding-top: 20px;
    }
    .sidebar a {
      color: #fff;
      padding: 12px 20px;
      display: block;
      text-decoration: none;
    }
    .sidebar a:hover {
      background-color: #495057;
    }
    .main-content {
      margin-left: 220px;
      padding: 40px;
    }
  </style>
</head>
<body>

<!-- 🧭 Menu lateral -->
<div class="sidebar">
  <h4 class="text-white text-center mb-4">Radar MDF</h4>
  <a href="index.html">🏠 Início</a>
  <a href="cadastro.html">📦 Cadastrar Produto</a>
  <a href="relatorios.html">📊 Relatórios</a>
  <a href="#">⚙️ Configurações</a>

<!-- 📋 Conteúdo principal -->

  >
    <input name="Email" type="email" placeholder="Email" required>
    <input name="Name" type="text" placeholder="Name" required>
    <button type="submit">Send</button>
  </form>

        <option value="Notebook Dell i5">Notebook Dell i5</option>
        <option value="Notebook Dell i7">Notebook Dell i7</option>
        <option value="Ramal Intelbras">Ramal Intelbras</option>
        <option value="Switch">Switch</option>
        <option value="Antena 4G elsys">Antena 4G elsys</option>

      <label class="form-label">Código do item</label>
      <input type="text" id="codigoItem" class="form-control" readonly>
    </div>

    <!-- Tipo -->
    <div class="mb-3">
      <label class="form-label">Tipo</label>
      <select name="tipo" id="tipo" class="form-select">
        <option value="selecione uma opcao">selecione uma opcao</option>
        <option value="Ar condicionado">Ar condicionado</option>

        <option value="Impressora">Impressora</option>

        <option value="Atendimento">Atendimento</option>
        <option value="Auditorio">Auditorio</option>
        <option value="Capital">Capital</option>
        <option value="Carregamento">Carregamento</option>
        <option value="Comercial/Eletro">Comercial/Eletro</option>
        <option value="Comercial/Moveis">Comercial/Moveis</option>
