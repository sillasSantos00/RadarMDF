<!DOCTYPE html>
<html lang="pt-br">
<head>
    <!-- ... seu cabeçalho e estilos ... -->
</head>
<body>
<!-- ... seu formulário e conteúdo ... -->

<form name="submit-to-google-sheet" method="POST">
    <label>Email:</label>
    <input type="email" name="email" required><br>

    <label>Primeiro Nome:</label>
    <input type="text" name="primeiro_nome" required><br>

    <label>Último Nome:</label>
    <input type="text" name="ultimo_nome" required><br>

    <label>Telefone:</label>
    <input type="text" name="telefone" required><br>

    <button type="submit">Enviar</button>
</form>

<!-- ✅ Aqui vai o JavaScript direto no HTML -->
<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbxAn0ZkrTv6Rxxal1KWkCeNh35r5Cezx0-kizQdt_tnB7tv8l1MoVN_xLegnfZHVdSc/exec';
    const form = document.forms['submit-to-google-sheet'];

    form.addEventListener('submit', e => {
      e.preventDefault();

      const formData = new FormData(form);
      const data = {};

      for (const [key, value] of formData.entries()) {
        data[key] = value;
      }

      const data_result = JSON.stringify(data);
//
      fetch(scriptURL, {
        method: 'POST',
        body: data_result,
        headers: {
          'Content-Type': 'application/json'
        }
      })
      .then(response => {
        alert("Feito! Formulário adicionado à planilha.");
        form.reset();
      })
      .catch(error => {
        alert("Ops. Não conseguimos receber o formulário, tente novamente ou verifique o problema.");
        console.error(error);
      });
    });
</script>
</body>
</html>
