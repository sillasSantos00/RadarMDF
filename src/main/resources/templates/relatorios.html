<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Radar MDF - Relatórios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
          min-height: 100vh;
        }
        .sidebar {
          width: 220px;
          background-color: #343a40;
          position: fixed;
          top: 0;
          bottom: 0;
          left: 0;
          padding-top: 20px;
        }
        .sidebar a {
          color: #fff;
          padding: 12px 20px;
          display: block;
          text-decoration: none;
        }
        .sidebar a:hover {
          background-color: #495057;
        }
        .main-content {
          margin-left: 220px;
          padding: 40px;
        }
    </style>
</head>
<body>

<!-- 🧭 Menu lateral -->
<div class="sidebar">
    <h4 class="text-white text-center mb-4">Radar MDF</h4>
    <a href="index.html">🏠 Início</a>
    <a href="cadastro.html">📦 Cadastrar Produto</a>
    <a href="relatorios.html">📊 Relatórios</a>
    <a href="#">⚙️ Configurações</a>
</div>

<!-- 📊 Conteúdo principal -->
<div class="main-content">
    <h2 class="mb-4">📊 Relatório de Produtos</h2>

    <table class="table table-bordered table-striped">
        <thead class="table-dark">
        <tr>
            <th>Nome</th>
            <th>Preço</th>
            <th>Descrição</th>
            <th>Categoria</th>
        </tr>
        </thead>
        <tbody id="tabela-produtos">
        <!-- Os produtos serão inseridos aqui via JavaScript -->
        </tbody>
    </table>
</div>

<script>
    fetch("/api/produtos")
      .then(res => res.json())
      .then(produtos => {
        const tabela = document.getElementById("tabela-produtos");
        produtos.forEach(p => {
          const linha = document.createElement("tr");
          linha.innerHTML = `
            <td>${p.nome}</td>
            <td>R$ ${p.preco.toFixed(2)}</td>
            <td>${p.descricao}</td>
            <td>${p.categoria}</td>
          `;
          tabela.appendChild(linha);
        });
      })
      .catch(() => {
        document.getElementById("tabela-produtos").innerHTML = `
          <tr><td colspan="4">Erro ao carregar produtos</td></tr>
        `;
      });
</script>

</body>
</html>
